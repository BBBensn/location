<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Location · bensn.me</title>
<meta name="description" content="Persönlicher Standortverlauf.">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Location">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/bensn.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

body { overscroll-behavior: none; }
.app-wrap {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 0 1.25rem 3rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Stats ── */
.loc-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 1rem;
}
.loc-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.loc-stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
}
.loc-stat-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

/* ── Tabs ── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
.tab {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 9px 14px;
  cursor: pointer;
  color: var(--muted);
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: none;
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab:hover:not(.active) { color: var(--text); }
.tab-section { display: none; }
.tab-section.visible { display: block; }

/* ── Map ── */
.map-wrap {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin-bottom: 1rem;
}
#map {
  height: 420px;
  background: var(--surface);
}
/* Dark map tiles via CSS invert */
.leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
.leaflet-container { background: #0a0a0b; }
/* Hide leaflet attribution branding but keep OSM credit */
.leaflet-control-attribution {
  font-family: 'DM Mono', monospace !important;
  font-size: 9px !important;
  background: rgba(10,10,11,0.8) !important;
  color: var(--muted) !important;
}
.leaflet-control-attribution a { color: var(--muted) !important; }

/* Day selector */
.day-selector {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.day-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
}
.day-btn.active {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
  background: rgba(0,166,251,0.08);
}
.day-btn:hover:not(.active) { border-color: var(--border-hover); color: var(--text); }

/* ── Timeline ── */
.day-group { margin-bottom: 1.5rem; }
.day-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  padding: 0 2px;
}
.day-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.day-count {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(255,255,255,0.2);
}
.day-line { flex: 1; height: 1px; background: var(--border); }

.timeline { display: flex; flex-direction: column; gap: 2px; }

.loc-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: border-color 0.15s;
  opacity: 0;
  transform: translateY(6px);
  animation: fadeUp 0.4s ease forwards;
}
.loc-row:hover { border-color: var(--border-hover); }

.loc-time-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.loc-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(0,166,251,0.5);
  flex-shrink: 0;
}
.loc-dot.recent { background: var(--accent-blue); box-shadow: 0 0 6px rgba(0,166,251,0.4); }
.loc-time {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.loc-main { min-width: 0; }
.loc-place {
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.loc-coords {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.loc-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.loc-acc { font-family: 'DM Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.2); }
.loc-acc.good { color: rgba(74,222,128,0.5); }
.loc-acc.ok   { color: rgba(250,204,21,0.4); }
.loc-acc.bad  { color: rgba(255,0,81,0.4); }

.load-more-btn {
  width: 100%;
  margin-top: 1rem;
  padding: 10px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.load-more-btn:hover { border-color: var(--border-hover); color: var(--text); }
.load-more-btn:disabled { opacity: 0.3; cursor: default; }

.state-msg {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--border);
  border-radius: 16px;
  line-height: 1.8;
}

@keyframes fadeUp { to { opacity: 1; transform: none; } }

</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="blobs" id="blobs"></div>

<div class="app-wrap">

  <nav class="app-nav intro-fade" style="animation-delay:0.05s">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">location</span>
    <div class="nav-right">
      <div class="dot" id="statusDot" style="background:var(--muted);animation:none"></div>
      <span id="statusText">laden…</span>
    </div>
  </nav>

  <div class="loc-stats intro-fade" style="animation-delay:0.12s">
    <div class="loc-stat">
      <div class="loc-stat-val" id="stat-total">—</div>
      <div class="loc-stat-label">Punkte gesamt</div>
    </div>
    <div class="loc-stat">
      <div class="loc-stat-val" id="stat-today">—</div>
      <div class="loc-stat-label">Heute</div>
    </div>
    <div class="loc-stat">
      <div class="loc-stat-val" id="stat-last">—</div>
      <div class="loc-stat-label">Letzter Punkt</div>
    </div>
  </div>

  <div class="tabs intro-fade" style="animation-delay:0.18s">
    <button class="tab active" onclick="switchTab('timeline',this)">Zeitachse</button>
    <button class="tab" onclick="switchTab('map',this)">Karte</button>
  </div>

  <!-- Zeitachse -->
  <div id="tab-timeline" class="tab-section visible">
    <div id="timeline-container"></div>
  </div>

  <!-- Karte -->
  <div id="tab-map" class="tab-section">
    <div class="day-selector" id="day-selector"></div>
    <div class="map-wrap">
      <div id="map"></div>
    </div>
  </div>

  <footer style="border-top:1px solid var(--border);padding:1rem 0;display:flex;justify-content:space-between;margin-top:auto">
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">location.bensn.me</span>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="footer-clock"></span>
  </footer>

</div>

<script src="/shared/bensn.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ── Clock ── */
function pad(n){return String(n).padStart(2,'0')}
function clockTick(){
  const n=new Date();
  const el=document.getElementById('footer-clock');
  if(el) el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
clockTick(); setInterval(clockTick,1000);

/* ── Helpers ── */
function fmtTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Vienna'});
}
function fmtCoord(lat,lon){
  if(lat==null||lon==null) return '—';
  return parseFloat(lat).toFixed(5)+'°N  '+parseFloat(lon).toFixed(5)+'°E';
}
function accClass(acc){
  if(!acc) return '';
  const n=parseFloat(acc);
  if(n<=20) return 'good';
  if(n<=60) return 'ok';
  return 'bad';
}
function fmtAcc(acc){
  if(!acc) return '—';
  return '±'+Math.round(parseFloat(acc))+'m';
}
function isToday(iso){
  const d=new Date(iso), t=new Date();
  return d.toDateString()===t.toDateString();
}
function fmtDayLabel(dateStr){
  const d=new Date(dateStr+'T12:00:00'), t=new Date();
  const diff=Math.floor((t-d)/86400000);
  if(diff===0) return 'Heute';
  if(diff===1) return 'Gestern';
  return d.toLocaleDateString('de-AT',{weekday:'short',day:'numeric',month:'short'});
}
function toViennaDate(iso){
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Europe/Vienna'});
}
function timeSince(iso){
  const diff=Math.floor((new Date()-new Date(iso))/60000);
  if(diff<2) return 'gerade';
  if(diff<60) return diff+'min';
  if(diff<1440) return Math.floor(diff/60)+'h';
  return Math.floor(diff/1440)+'d';
}

/* ── Tabs ── */
let mapInitialized = false;
let leafletMap = null;
let currentDay = null;

function switchTab(t, el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-timeline').classList.toggle('visible', t==='timeline');
  document.getElementById('tab-map').classList.toggle('visible', t==='map');
  if(t==='map') initMap();
}

/* ── Map ── */
function initMap(){
  if(mapInitialized) return;
  mapInitialized = true;

  leafletMap = L.map('map', {
    zoomControl: true,
    attributionControl: true,
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19,
  }).addTo(leafletMap);

  renderMapDay(currentDay || Object.keys(dayGroups)[0]);
}

let dayGroups = {}; // date → [points]
let mapLayers = [];

function renderMapDay(day){
  if(!leafletMap) return;
  currentDay = day;

  // Update day buttons
  document.querySelectorAll('.day-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.day===day);
  });

  // Clear old layers
  mapLayers.forEach(l=>leafletMap.removeLayer(l));
  mapLayers = [];

  const pts = dayGroups[day] || [];
  if(!pts.length) return;

  const coords = pts.map(p=>[parseFloat(p.latitude), parseFloat(p.longitude)]);

  // Track line
  const line = L.polyline(coords, {
    color: '#00A6FB',
    weight: 2,
    opacity: 0.6,
  }).addTo(leafletMap);
  mapLayers.push(line);

  // Dots for each point
  pts.forEach((p, i) => {
    const isFirst = i === 0;
    const isLast  = i === pts.length - 1;
    const lat = parseFloat(p.latitude);
    const lon = parseFloat(p.longitude);

    const marker = L.circleMarker([lat, lon], {
      radius: isFirst ? 7 : isLast ? 5 : 3,
      fillColor: isFirst ? '#4ade80' : isLast ? '#FF0051' : '#00A6FB',
      fillOpacity: isFirst || isLast ? 0.9 : 0.5,
      color: 'transparent',
      weight: 0,
    }).addTo(leafletMap);

    const place = p.district
      ? `${p.district}, ${p.city || ''}`
      : p.city || fmtCoord(p.latitude, p.longitude);

    marker.bindPopup(`
      <div style="font-family:'DM Mono',monospace;font-size:11px;line-height:1.6">
        <strong style="font-family:'Syne',sans-serif;font-size:13px">${place}</strong><br>
        ${fmtTime(p.timestamp)}<br>
        <span style="color:#666">${fmtAcc(p.accuracy)}</span>
      </div>
    `, { className: 'loc-popup' });

    mapLayers.push(marker);
  });

  leafletMap.fitBounds(line.getBounds(), { padding: [24, 24] });
}

/* ── API ── */
async function apiFetch(path){
  const r=await fetch(path);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

/* ── State ── */
let allPoints=[];
let offset=0;
const LIMIT=200; // mehr Punkte für Karte

/* ── Timeline Render ── */
function renderTimeline(points, append=false){
  const container=document.getElementById('timeline-container');
  if(!append) container.innerHTML='';

  if(!points||points.length===0){
    if(!append) container.innerHTML='<div class="state-msg">Noch keine Standortdaten.<br><span style="font-size:10px">OwnTracks sendet automatisch.</span></div>';
    return;
  }

  const groups={};
  points.forEach(p=>{
    const day=toViennaDate(p.timestamp);
    if(!groups[day]) groups[day]=[];
    groups[day].push(p);
  });

  const now=new Date();
  const recentThreshold=15*60*1000;

  Object.entries(groups).forEach(([day,pts])=>{
    let groupEl=document.getElementById('day-'+day);
    if(!groupEl){
      groupEl=document.createElement('div');
      groupEl.className='day-group';
      groupEl.id='day-'+day;
      groupEl.innerHTML=`
        <div class="day-header">
          <span class="day-label">${fmtDayLabel(day)}</span>
          <span class="day-count" id="count-${day}">${pts.length} Punkte</span>
          <div class="day-line"></div>
        </div>
        <div class="timeline" id="tl-${day}"></div>`;
      container.appendChild(groupEl);
    } else {
      const countEl=document.getElementById('count-'+day);
      if(countEl) countEl.textContent=pts.length+' Punkte';
    }

    const timelineEl=document.getElementById('tl-'+day);

    pts.forEach((p,i)=>{
      const isRecent=(now-new Date(p.timestamp))<recentThreshold;
      const row=document.createElement('div');
      row.className='loc-row';
      row.style.animationDelay=(i*20)+'ms';

      const placeName = p.city
        ? (p.district?`${p.district}, ${p.city}`:p.city)
        : fmtCoord(p.latitude,p.longitude);
      const showCoords = !!p.city;

      row.innerHTML=`
        <div class="loc-time-col">
          <div class="loc-dot${isRecent?' recent':''}"></div>
          <div class="loc-time">${fmtTime(p.timestamp)}</div>
        </div>
        <div class="loc-main">
          <div class="loc-place">${placeName}</div>
          ${showCoords?`<div class="loc-coords">${fmtCoord(p.latitude,p.longitude)}</div>`:''}
        </div>
        <div class="loc-meta">
          <span class="loc-acc ${accClass(p.accuracy)}">${fmtAcc(p.accuracy)}</span>
        </div>`;
      timelineEl.appendChild(row);
    });
  });
}

/* ── Day Selector for Map ── */
function buildDaySelector(){
  const sel = document.getElementById('day-selector');
  sel.innerHTML = '';
  const days = Object.keys(dayGroups).sort().reverse();
  days.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i===0?' active':'');
    btn.dataset.day = day;
    btn.textContent = fmtDayLabel(day);
    btn.onclick = () => renderMapDay(day);
    sel.appendChild(btn);
  });
}

/* ── Stats ── */
function updateStats(points){
  document.getElementById('stat-total').textContent = (points.length >= LIMIT ? points.length+'+' : points.length);
  document.getElementById('stat-today').textContent = points.filter(p=>isToday(p.timestamp)).length;
  const last = points[0];
  document.getElementById('stat-last').textContent = last ? timeSince(last.timestamp) : '—';
}

/* ── Load ── */
async function loadPoints(append=false){
  try{
    const data=await apiFetch(`/api/locations?limit=${LIMIT}&offset=${offset}`);
    const points=data.locations||data||[];

    allPoints = append ? [...allPoints, ...points] : points;

    // Rebuild day groups for map
    dayGroups = {};
    allPoints.forEach(p=>{
      const day=toViennaDate(p.timestamp);
      if(!dayGroups[day]) dayGroups[day]=[];
      dayGroups[day].push(p);
    });

    const dot=document.getElementById('statusDot');
    const statusText=document.getElementById('statusText');
    if(allPoints.length>0){
      const minAgo=Math.floor((new Date()-new Date(allPoints[0].timestamp))/60000);
      dot.style.background=minAgo<30?'var(--green)':'var(--muted)';
      dot.style.animation=minAgo<30?'pulse 2s ease-in-out infinite':'none';
      statusText.textContent=minAgo<30?'aktiv':'letzter: '+timeSince(allPoints[0].timestamp);
    } else {
      dot.style.background='var(--muted)'; dot.style.animation='none';
      statusText.textContent='keine daten';
    }

    updateStats(allPoints);
    renderTimeline(points, append);
    buildDaySelector();

    // If map tab active, re-render
    if(mapInitialized && currentDay) renderMapDay(currentDay);

    // Load more
    const existingBtn=document.getElementById('load-more');
    if(points.length>=LIMIT){
      if(!existingBtn){
        const btn=document.createElement('button');
        btn.id='load-more';
        btn.className='load-more-btn';
        btn.textContent='Mehr laden';
        btn.onclick=()=>{
          offset+=LIMIT;
          btn.textContent='Laden…';
          btn.disabled=true;
          loadPoints(true).then(()=>{ btn.textContent='Mehr laden'; btn.disabled=false; });
        };
        document.getElementById('timeline-container').appendChild(btn);
      }
    } else {
      existingBtn?.remove();
    }

  }catch(e){
    document.getElementById('statusDot').style.background='var(--accent-red)';
    document.getElementById('statusText').textContent='fehler';
    if(!append){
      document.getElementById('timeline-container').innerHTML=
        `<div class="state-msg">Verbindungsfehler<br><span style="color:var(--accent-red);font-size:10px">${e.message}</span></div>`;
    }
  }
}

loadPoints();
setInterval(()=>{ offset=0; loadPoints(false); }, 60000);
</script>

</body>
</html>
