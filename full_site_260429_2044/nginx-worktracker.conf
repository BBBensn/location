# /etc/nginx/sites-available/worktracker.bensn.me
# Symlink nach sites-enabled und certbot ausführen

server {
    listen 80;
    server_name worktracker.bensn.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name worktracker.bensn.me;

    # SSL – wird von Certbot ausgefüllt
    # ssl_certificate ...
    # ssl_certificate_key ...

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Health check (kein Auth nötig)
    location /health {
        proxy_pass http://127.0.0.1:5001;
    }

    # Web-Interface (kommt später)
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
